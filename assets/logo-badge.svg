<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <path id="textCircleTop" d="M 40,160 A 120,120 0 1,1 280,160" fill="none"/>
    <path id="textCircleBottom" d="M 280,160 A 120,120 0 1,1 40,160" fill="none"/>
  </defs>

  <!-- Outer Ring with Cog/Notch details -->
  <circle cx="160" cy="160" r="150" fill="#0B0F17" stroke="url(#badgeGold)" stroke-width="4"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#334155" stroke-dasharray="4,4" stroke-width="2"/>
  <circle cx="160" cy="160" r="102" fill="#131B2B" stroke="url(#badgeGold)" stroke-width="2"/>

  <!-- Curved Text Top -->
  <text font-family="'Inter', sans-serif" font-size="12.5" font-weight="800" fill="#FCD34D" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ★ KHUSHAL BUILDERS INC. ★
    </textPath>
  </text>

  <!-- Curved Text Bottom -->
  <text font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" letter-spacing="3">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      • LICENSED &amp; INSURED • GTA •
    </textPath>
  </text>

  <!-- Center Monogram -->
  <g transform="translate(160, 160)">
    <!-- Excavator Boom Apex -->
    <polygon points="-8,-42 12,-55 20,-48 0,-35" fill="#EA580C"/>
    <polygon points="12,-55 28,-44 24,-40 11,-50" fill="#FCD34D"/>
    <polygon points="28,-44 34,-47 37,-42 30,-37" fill="#F59E0B"/>

    <!-- K -->
    <rect x="-24" y="-34" width="10" height="42" rx="2" fill="url(#badgeGold)"/>
    <polygon points="-14,-14 6,-34 -2,-34 -20,-16" fill="url(#badgeGold)"/>
    <polygon points="-14,-10 8,8 -1,8 -20,-6" fill="url(#badgeGold)"/>

    <!-- B -->
    <path d="M -8,-34 L 8,-34 C 18,-34 25,-29 25,-21 C 25,-14 18,-11 8,-11 L -8,-11 Z" fill="#FFFFFF"/>
    <path d="M -3,-29 L 6,-29 C 11,-29 15,-27 15,-21 C 15,-16 11,-16 6,-16 L -3,-16 Z" fill="#131B2B"/>
    <path d="M -8,-12 L 11,-12 C 20,-12 28,-6 28,2 C 28,10 20,8 11,8 L -8,8 Z" fill="url(#badgeGold)"/>
    <path d="M -3,-7 L 8,-7 C 14,-7 18,-4 18,2 C 18,5 14,4 8,4 L -3,4 Z" fill="#131B2B"/>

    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="900" letter-spacing="2" fill="#FCD34D">
      CONCRETE SOLUTIONS
    </text>
  </g>
</svg>