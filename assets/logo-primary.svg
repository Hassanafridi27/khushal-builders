<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#0B0F17" rx="16"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="650"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="300" y1="0" x2="300" y2="650"/>
    <line x1="400" y1="0" x2="400" y2="650"/>
    <line x1="500" y1="0" x2="500" y2="650"/>
    <line x1="600" y1="0" x2="600" y2="650"/>
    <line x1="700" y1="0" x2="700" y2="650"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Central Emblem Symbol -->
  <g transform="translate(400, 195)" filter="url(#shadow)">
    <!-- Shield / Hexagon Frame Base -->
    <polygon points="0,-145 155,-55 155,95 0,165 -155,95 -155,-55" fill="#131B2B" stroke="#1E293B" stroke-width="4"/>
    <polygon points="0,-135 145,-50 145,88 0,152 -145,88 -145,-50" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

    <!-- Geometric Construction KB Monogram & Excavator Boom Motif -->
    <!-- K - Pillar Stem -->
    <path d="M -85,-75 L -45,-75 L -45,75 L -85,75 Z" fill="url(#goldGrad)"/>
    <polygon points="-85,-75 -70,-90 -30,-90 -45,-75" fill="#FCD34D" opacity="0.8"/>

    <!-- K - Upper Diagonal Arm (Architectural Truss / Crane Boom) -->
    <polygon points="-40,-10 25,-75 -10,-75 -55,-25" fill="url(#goldGrad)"/>
    
    <!-- Heavy Excavator Boom & Hydraulic Arm Silhouette Merging Overhead -->
    <!-- Boom segment 1 -->
    <polygon points="-50,-80 20,-125 45,-105 -25,-60" fill="url(#orangeGrad)"/>
    <!-- Dipper arm & Bucket apex -->
    <polygon points="20,-125 75,-85 62,-72 15,-110" fill="#FCD34D"/>
    <!-- Bucket -->
    <polygon points="75,-85 92,-95 105,-80 82,-65 65,-75" fill="#F59E0B"/>
    <polygon points="92,-95 96,-102 98,-98 102,-105 104,-100 108,-106 105,-80" fill="#EA580C"/>

    <!-- K - Lower Diagonal Arm & Building Foundation -->
    <polygon points="-40,5 28,75 -15,75 -60,25" fill="url(#goldGrad)"/>

    <!-- B - Geometric Interlocking Structure -->
    <!-- Central separator -->
    <path d="M -20,-75 L 45,-75 C 75,-75 92,-55 92,-30 C 92,-10 78,5 50,5 L -20,5 Z" fill="#FFFFFF"/>
    <!-- Inner cutout top -->
    <path d="M 0,-55 L 40,-55 C 55,-55 68,-48 68,-32 C 68,-18 55,-15 40,-15 L 0,-15 Z" fill="#131B2B"/>

    <!-- Lower loop of B -->
    <path d="M -20,-3 L 55,-3 C 85,-3 102,15 102,40 C 102,65 82,75 50,75 L -20,75 Z" fill="url(#goldGrad)"/>
    <!-- Inner cutout bottom -->
    <path d="M 0,15 L 45,15 C 62,15 75,22 75,38 C 75,54 62,58 45,58 L 0,58 Z" fill="#131B2B"/>

    <!-- Accent Dynamic Cut Line -->
    <line x1="-120" y1="110" x2="120" y2="110" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="110" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name Primary -->
  <text x="400" y="420" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="10" fill="#FFFFFF">
    KHUSHAL
  </text>

  <!-- Brand Name Secondary -->
  <text x="400" y="470" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="14" fill="#F59E0B">
    BUILDERS INC.
  </text>

  <!-- Divider Line with Diamond Center -->
  <g transform="translate(400, 505)">
    <line x1="-180" y1="0" x2="-25" y2="0" stroke="#334155" stroke-width="2"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#F59E0B"/>
    <line x1="25" y1="0" x2="180" y2="0" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Official Tagline (Correcting flyer typo to 'SOLUTIONS') -->
  <text x="400" y="540" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#94A3B8">
    WE TRANSFORM YOUR DREAMS INTO CONCRETE SOLUTIONS
  </text>

  <!-- Specialty Badges Footer -->
  <g transform="translate(400, 590)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#131B2B" stroke="#334155" stroke-width="1"/>
    <text x="-160" y="5" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FCD34D">★ RESIDENTIAL</text>
    <circle cx="-80" cy="0" r="2.5" fill="#64748B"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">COMMERCIAL</text>
    <circle cx="80" cy="0" r="2.5" fill="#64748B"/>
    <text x="160" y="5" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#FCD34D">RENOVATIONS ★</text>
  </g>
</svg>